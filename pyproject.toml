[project]
name = "tracefork-workspace"
version = "0.1.0"
description = "Replay AI agent failures locally and turn them into regression tests."
authors = [{name = "The TraceFork Authors"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

# The workspace root is a virtual project: it owns developer tooling only.
# Shippable code lives in packages/*.

[tool.uv.sources]
tracefork-agent = { workspace = true }

[dependency-groups]
docs = ["mkdocs-material>=9.5"]
dev = [
    "tracefork-agent",
    "openai>=1.40",
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.108",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pytest-cov>=5",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Typer's declarative API requires calls in parameter defaults.
"packages/tracefork-core/src/tracefork/cli/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages"]
