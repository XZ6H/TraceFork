[project]
name = "tracefork"
version = "0.1.0"
description = "Replay AI agent failures locally and turn them into regression tests."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

# The workspace root is a virtual project: it owns developer tooling only.
# Shippable code lives in packages/* and is added per milestone.

[dependency-groups]
dev = [
    "tracefork-core",
    "tracefork-openai",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.108",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.28.1",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
tracefork-core = { workspace = true }
tracefork-openai = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages"]
