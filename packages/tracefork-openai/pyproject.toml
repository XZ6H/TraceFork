[project]
name = "tracefork-openai"
version = "0.1.0"
description = "OpenAI adapter for TraceFork: record and replay Responses API calls."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["../../LICENSE"]
dependencies = ["openai>=1.40", "tracefork-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracefork_openai"]
