[project]
name = "tracefork-openai"
version = "0.1.0"
description = "OpenAI adapter for TraceFork: record and replay Responses API calls."
authors = [{name = "The TraceFork Authors"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["openai>=1.40", "tracefork-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracefork_openai"]
