[project]
name = "tracefork-cli"
version = "0.1.0"
description = "Command-line interface for TraceFork: init, record, inspect, replay."
authors = [{name = "The TraceFork Authors"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["../../LICENSE"]
dependencies = ["pyyaml>=6.0", "rich>=13.7", "tracefork-core", "typer>=0.12"]

[project.scripts]
tracefork = "tracefork_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracefork_cli"]
