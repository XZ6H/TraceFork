[project]
name = "tracefork-httpx"
version = "0.1.0"
description = "httpx adapter for TraceFork: record and replay HTTP traffic."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["../../LICENSE"]
dependencies = ["httpx>=0.27", "tracefork-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracefork_httpx"]
